[Plugin]
Name=IA Assistant
Description=AI-powered table assistant for Visual Pinball X
Version=1.0.0
Author=VPinball Community
Website=https://github.com/vpinball/vpinball

[Features]
TableAnalysis=1
ElementGeneration=1
ImprovementSuggestions=1
ThemeGeneration=1

[APIProviders]
Default=freellmapi
Freellmapi=https://api.freellmapi.com/v1
Fcc=https://api.fcc.dev
Local=http://localhost:11434

[UI]
MainMenuEntry=1
ToolbarButton=1
KeyboardShortcut=Ctrl+I

[Dependencies]
Requires=SDL3
Optional=nlohmann_json3